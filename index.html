<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950">
    <main>
        <header class="flex justify-center items-center bg-gray-950 p-5 gap-4">
            <form class="w-full flex justify-center">
                <input id="searchInput" class="w-96 h-10 rounded-lg bg-white text-center" type="text" placeholder="chercher un movie">
            </form>
            <a href="admin.html" class="text-yellow-400 font-bold hover:text-yellow-300">Admin</a>
        </header>
        <section class="flex justify-start bg-yellow-400 p-2">
            <select id="optionFilter" class="border rounded-lg text-gray-800 px-4 py-2 border-gray-800">
                <option value="all">Tous</option>
                <option value="movie">Movie</option>
                <option value="series">Serie</option>
            </select>
        </section>
        <div class="flex flex-col lg:flex-row min-h-screen p-4 gap-4">
            <section id="list" class="flex-1 min-w-0 flex flex-wrap gap-4 content-start"></section>
            <aside class="w-full lg:w-64 lg:shrink-0 border-2 border-gray-700 p-5 rounded-xl bg-gray-900">
                <p class="text-xl font-bold bg-black text-gray-300 text-center p-2 rounded-lg">Favorites</p>
                <div id="favoritesList" class="mt-4 flex flex-col gap-3"></div>
            </aside>
        </div>
        <div id="pagination" class="flex justify-center items-center gap-2 p-5"></div>
        <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex justify-center items-center z-50 p-4">
            <div class="bg-gray-800 p-6 rounded-xl w-full md:w-1/2 max-h-[90vh] overflow-y-auto">
                <button id="closeModal" class="text-white text-2xl float-right">X</button>
                <div id="modalContent" class="text-white"></div>
            </div>
        </div>
        <footer></footer>
    </main>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
