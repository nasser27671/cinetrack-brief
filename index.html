<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950">
    <main>

        <header class="flex justify-center bg-gray-950 p-5">

            <form class="w-full flex justify-center">
                <input id="searchInput" class="w-96 h-10 rounded-lg bg-white text-center" type="text" placeholder="chercher un movie">
            </form>

        </header>

        <section class="flex justify-start bg-yellow-400 p-2">

            <select id="optionFilter" class="border rounded-lg text-gray-800 px-4 py-2 border-gray-800">
                <option value="all">Tous</option>
                <option value="Movie">Movie</option>
                <option value="Serie">Serie</option>
            </select>

        </section>

        <div class="flex min-h-screen p-4 gap-4">
            <section id="list" class="flex-1 flex flex-wrap gap-4">

            </section>

            <aside class="w-64 border-2 p-5 rounded-xl">
                <p class="text-xl font-bold bg-black text-gray-500 text-center">Favorites</p>
            </aside>

        </div>

        <footer>

        </footer>
    </main>

    <script type="module" src="src/api.js"></script>

</body>
</html>
